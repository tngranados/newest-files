name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "4.0"
          bundler-cache: true

      - name: Install dependencies
        run: bundle install

      - name: Get version from tag
        id: get_version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Update version.rb from tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          sed -i "s/VERSION = '[^']*'/VERSION = '${VERSION}'/" lib/newest_files/version.rb
          cat lib/newest_files/version.rb

      - name: Run tests
        run: bundle exec rake test

      - name: Build gem
        run: gem build newest_files.gemspec

      - name: Commit version update and move tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add lib/newest_files/version.rb
          git commit -m "Bump version to ${VERSION}" || echo "No changes to commit"
          
          # Move the tag to the new commit that includes the version update
          git tag -f "v${VERSION}"
          git push origin main
          git push origin "v${VERSION}" --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: newest_files-${{ steps.get_version.outputs.VERSION }}.gem
          generate_release_notes: true
